
services:
  driftlab:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: driftlab-app

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      PYTHONPATH: /app/src
      DRIFTLAB_ADMIN_KEY: ${DRIFTLAB_ADMIN_KEY:-}

    volumes:
      - ./models:/app/models
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
